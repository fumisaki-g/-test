<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JS Mobile Playground - รันโค้ด JavaScript บนมือถือ</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts - Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .code-font {
            font-family: 'Fira Code', monospace;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-20 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-2">
            <div class="bg-amber-400 text-slate-950 p-1.5 rounded-lg text-lg font-bold flex items-center justify-center w-8 h-8">
                JS
            </div>
            <div>
                <h1 class="text-base font-semibold leading-tight text-white">JS Runner Mobile</h1>
                <p class="text-xs text-slate-400">รันโค้ดและดูผลทันทีบนมือถือ</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button id="clear-all-btn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center space-x-1">
                <i class="fa-solid fa-rotate-left"> { }</i>
                <span>รีเซ็ต</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-3 sm:p-4 flex flex-col gap-3">

        <!-- Templates Bar -->
        <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800 shadow-sm">
            <div class="text-xs text-slate-400 mb-2 flex items-center space-x-1">
                <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
                <span>ตัวอย่างโค้ดด่วน (กดเพื่อเปลี่ยนโค้ด):</span>
            </div>
            <div class="flex flex-wrap gap-1.5">
                <button onclick="loadTemplate('sorry10k')" class="text-xs bg-indigo-950 hover:bg-indigo-900 text-indigo-200 border border-indigo-800 px-2.5 py-1.5 rounded-lg transition font-medium flex items-center space-x-1">
                    <i class="fa-solid fa-heart-crack text-rose-400"></i>
                    <span>ขอโทษ 10,000 ครั้ง</span>
                </button>
                <button onclick="loadTemplate('sorrySlow')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-2.5 py-1.5 rounded-lg transition flex items-center space-x-1">
                    <i class="fa-solid fa-list-ol text-blue-400"></i>
                    <span>ขอโทษ + เลขข้อ</span>
                </button>
                <button onclick="loadTemplate('simple')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-2.5 py-1.5 rounded-lg transition flex items-center space-x-1">
                    <i class="fa-solid fa-terminal text-emerald-400"></i>
                    <span>ตัวอย่างพื้นฐาน</span>
                </button>
            </div>
        </div>

        <!-- Code Editor Section -->
        <div class="flex-1 flex flex-col bg-slate-900 rounded-xl border border-slate-800 overflow-hidden shadow-lg min-h-[220px]">
            <div class="bg-slate-800/80 px-3 py-2 border-b border-slate-800 flex justify-between items-center text-xs text-slate-400">
                <span class="flex items-center space-x-1.5">
                    <i class="fa-solid fa-code text-indigo-400"></i>
                    <span>เขียนโค้ดที่นี่ (JavaScript)</span>
                </span>
                <button onclick="clearEditor()" class="hover:text-slate-200 px-2 py-0.5 rounded bg-slate-700/50 hover:bg-slate-700 transition">
                    <i class="fa-solid fa-trash-can mr-1"></i>ล้างโค้ด
                </button>
            </div>
            
            <div class="relative flex-1">
                <textarea id="code-input" class="w-full h-full p-3 bg-slate-950 text-emerald-400 code-font text-sm sm:text-base focus:outline-none resize-none leading-relaxed" placeholder="// พิมพ์โค้ด JavaScript ของคุณที่นี่..." spellcheck="false" autocomplete="off" capitalize="none"></textarea>
            </div>

            <!-- Action Bar -->
            <div class="p-2.5 bg-slate-900 border-t border-slate-800 flex items-center justify-between gap-2">
                <div class="text-xs text-slate-400 hidden sm:block">
                    กด <kbd class="px-1.5 py-0.5 bg-slate-800 rounded text-slate-300 font-mono">Run</kbd> เพื่อประมวลผล
                </div>
                <button id="run-btn" onclick="runJavaScript()" class="w-full sm:w-auto flex-1 sm:flex-none bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 active:scale-95 text-slate-950 font-bold px-6 py-2.5 rounded-lg shadow-lg shadow-emerald-950/50 transition flex items-center justify-center space-x-2 text-base">
                    <i class="fa-solid fa-play"></i>
                    <span>กดรันโค้ดทันที</span>
                </button>
            </div>
        </div>

        <!-- Output Console Section -->
        <div class="flex-1 flex flex-col bg-slate-900 rounded-xl border border-slate-800 overflow-hidden shadow-lg min-h-[200px]">
            <!-- Console Header -->
            <div class="bg-slate-800/80 px-3 py-2 border-b border-slate-800 flex justify-between items-center text-xs">
                <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
                    <span class="font-semibold text-slate-300">ผลลัพธ์ (Console)</span>
                    <span id="execution-time" class="text-slate-500 text-[10px]"></span>
                </div>
                <button onclick="clearConsole()" class="text-slate-400 hover:text-slate-200 px-2 py-0.5 rounded bg-slate-700/50 hover:bg-slate-700 transition">
                    <i class="fa-solid fa-eraser mr-1"></i>ล้างหน้าจอ
                </button>
            </div>

            <!-- Console Log Display Area -->
            <div id="console-output" class="flex-1 p-3 bg-slate-950 code-font text-xs sm:text-sm text-slate-200 overflow-y-auto max-h-[300px] space-y-1">
                <div class="text-slate-500 italic">// ผลลัพธ์จะแสดงที่นี่หลังจากคุณกด "รันโค้ด"</div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-3 px-4 text-center text-xs text-slate-500 border-t border-slate-900">
        ออกแบบมาสำหรับการรันโค้ด JavaScript บนมือถืออย่างปลอดภัย
    </footer>

    <script>
        // Preset code templates
        const templates = {
            sorry10k: `// วิธีนี้ต่อข้อความแล้วพิมพ์ทีเดียว (รวดเร็วมาก ไม่ทำให้มือถือค้าง)
const text = "ขอโทษ\\n".repeat(10000);
console.log(text);
console.log("--- พิมพ์คำว่า ขอโทษ ครบ 10,000 ครั้งเรียบร้อยแล้ว ---");`,

            sorrySlow: `// พิมพ์ขอโทษพร้อมลำดับข้อ (จำกัดการแสดงผลให้ดูเพื่อป้องกันเครื่องค้าง)
console.log("เริ่มประมวลผลลูป...");

let count = 0;
for (let i = 1; i <= 10000; i++) {
    count++;
}

console.log(\`วนลูปครบ \${count.toLocaleString()} รอบแล้ว!\`);
console.log("ตัวอย่าง 5 ข้อแรก:");
for (let i = 1; i <= 5; i++) {
    console.log(\`ข้อที่ \${i}: ขอโทษครับ\`);
}
console.log("...");
console.log("ตัวอย่าง 5 ข้อสุดท้าย:");
for (let i = 9996; i <= 10000; i++) {
    console.log(\`ข้อที่ \${i}: ขอโทษครับ\`);
}`,

            simple: `// ตัวอย่างการทำงานทั่วไป
const name = "ผู้ใช้งาน";
const count = 10;

console.log("สวัสดีคุณ " + name);

for (let i = 1; i <= count; i++) {
    console.log("นับรอบที่: " + i);
}

console.log("เสร็จสิ้นการทำงาน!");`
        };

        const codeInput = document.getElementById('code-input');
        const consoleOutput = document.getElementById('console-output');
        const executionTimeEl = document.getElementById('execution-time');

        // Set default template on load
        window.onload = function() {
            loadTemplate('sorry10k');
        };

        function loadTemplate(key) {
            if (templates[key]) {
                codeInput.value = templates[key];
                clearConsole();
            }
        }

        function clearEditor() {
            codeInput.value = '';
            codeInput.focus();
        }

        function clearConsole() {
            consoleOutput.innerHTML = '<div class="text-slate-500 italic">// ผลลัพธ์ถูกล้างแล้ว</div>';
            executionTimeEl.textContent = '';
        }

        // Custom Console log implementation to append to UI
        function createCustomConsole() {
            const logs = [];
            let lineCount = 0;
            const MAX_LINES = 2000; // Limit max DOM elements for performance

            return {
                log: function(...args) {
                    const message = args.map(arg => {
                        if (typeof arg === 'object') {
                            try {
                                return JSON.stringify(arg, null, 2);
                            } catch (e) {
                                return String(arg);
                            }
                        }
                        return String(arg);
                    }).join(' ');

                    logs.push({ type: 'log', text: message });
                },
                error: function(...args) {
                    const message = args.map(arg => String(arg)).join(' ');
                    logs.push({ type: 'error', text: message });
                },
                warn: function(...args) {
                    const message = args.map(arg => String(arg)).join(' ');
                    logs.push({ type: 'warn', text: message });
                },
                getLogs: () => logs
            };
        }

        // Safe JavaScript Execution Engine
        function runJavaScript() {
            const code = codeInput.value;
            if (!code.trim()) {
                consoleOutput.innerHTML = '<div class="text-amber-400"><i class="fa-solid fa-triangle-exclamation mr-1"></i> กรุณากรอกโค้ดก่อนทำการรัน</div>';
                return;
            }

            // Clear output area
            consoleOutput.innerHTML = '';
            
            const customConsole = createCustomConsole();
            const startTime = performance.now();

            try {
                // Execute code with scoped custom console
                const runFn = new Function('console', code);
                runFn(customConsole);

                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(2);
                executionTimeEl.textContent = `(ใช้เวลา ${duration} ms)`;

                // Render Logs
                const logs = customConsole.getLogs();
                if (logs.length === 0) {
                    consoleOutput.innerHTML = '<div class="text-slate-400 italic">// โค้ดทำงานสำเร็จ (ไม่มีการใช้ console.log แสดงผล)</div>';
                    return;
                }

                // Render output line by line safely
                const fragment = document.createDocumentFragment();
                let outputCount = 0;

                for (const log of logs) {
                    // Split long multi-line strings
                    const lines = log.text.split('\n');
                    
                    for (const line of lines) {
                        outputCount++;
                        if (outputCount > 3000) {
                            const overflowDiv = document.createElement('div');
                            overflowDiv.className = 'text-amber-400 italic font-semibold border-t border-slate-800 pt-1 mt-1';
                            overflowDiv.textContent = `... ตัดการแสดงผลเนื่องจากเกิน 3,000 บรรทัด (เพื่อป้องกันเบราว์เซอร์มือถือค้าง)`;
                            fragment.appendChild(overflowDiv);
                            break;
                        }

                        const div = document.createElement('div');
                        div.className = 'break-words whitespace-pre-wrap leading-tight py-0.5';

                        if (log.type === 'error') {
                            div.className += ' text-rose-400 bg-rose-950/30 px-1 rounded';
                        } else if (log.type === 'warn') {
                            div.className += ' text-amber-300';
                        } else {
                            div.className += ' text-emerald-300';
                        }

                        div.textContent = line;
                        fragment.appendChild(div);
                    }

                    if (outputCount > 3000) break;
                }

                consoleOutput.appendChild(fragment);

            } catch (err) {
                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(2);
                executionTimeEl.textContent = `(เกิดข้อผิดพลาด)`;

                const errDiv = document.createElement('div');
                errDiv.className = 'text-rose-400 bg-rose-950/40 p-2 rounded-lg border border-rose-800/50 break-words';
                errDiv.innerHTML = `<div class="font-bold mb-1"><i class="fa-solid fa-circle-xmark mr-1"></i>เกิดข้อผิดพลาด (Syntax/Runtime Error):</div><div>${escapeHtml(err.message)}</div>`;
                consoleOutput.appendChild(errDiv);
            }

            // Auto scroll console to bottom
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        // Helper function to escape HTML special characters
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Handle default reset
        document.getElementById('clear-all-btn').addEventListener('click', () => {
            loadTemplate('sorry10k');
        });
    </script>
</body>
</html>
